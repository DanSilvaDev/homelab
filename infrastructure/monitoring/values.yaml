# kube-prometheus-stack (prometheus-community/kube-prometheus-stack)
# Cluster: k3s (Rancher removido em 2026-10-28, ver troubleshooting/rancher_removal_traefik_crd_conflict.md)
#   - kubecluster-lenovo-z40-70 (control-plane): 4 vCPU / 15GiB RAM, ~896GB disco
#   - worker1: 4 vCPU / 15GiB RAM, ~93GB disco
#   - worker2: 5 vCPU / 10GiB RAM, GPU (GTX 970), ~18GB disco (label gpu=true)
#
# k3s embute controller-manager/scheduler/etcd no próprio binário, expostos só em
# 127.0.0.1 por padrão. Os ServiceMonitors padrão do chart não conseguem alcançá-los
# e ficariam permanentemente "down" -> desabilitados aqui para não gerar alertas falsos.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

kubeStateMetrics:
  enabled: true

# DaemonSet - roda em TODOS os nodes, incluindo o worker2 (queremos métricas de host dele também)
nodeExporter:
  enabled: true

prometheus:
  service:
    type: LoadBalancer
    # IP fixo alocado pelo kube-vip-cloud-provider (range 192.168.3.200-254)
    loadBalancerIP: 192.168.3.203
    port: 80
    targetPort: 9090
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-nfs-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  service:
    type: LoadBalancer
    # IP fixo alocado pelo kube-vip-cloud-provider (range 192.168.3.200-254)
    loadBalancerIP: 192.168.3.204
    port: 80
    targetPort: 9093
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-nfs-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    # Secrets criados manualmente via `kubectl create secret` (não commitados).
    # O Prometheus Operator monta cada um em /etc/alertmanager/secrets/<nome-do-secret>/<key>.
    secrets:
      - alertmanager-telegram-api-key
      - alertmanager-telegram-chat-id

  # Roteamento de alertas: Telegram (bot próprio) + ntfy self-hosted (push no celular).
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: notifications
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      # Mesma pegadinha do "receivers" abaixo: o Helm substitui a lista "routes" inteira
      # (não faz merge item a item). O chart por padrão já inclui uma sub-rota pro
      # alerta sintético "Watchdog" -> receiver "null" - precisa ser reincluída aqui
      # manualmente (confirmada via Status do Alertmanager antes de editar), senão
      # some e o Watchdog passa a notificar normalmente junto com alertas reais.
      routes:
        - receiver: "null"
          matchers:
            - alertname="Watchdog"
          continue: false
        # NodeMemoryHighUtilization no TrueNAS (192.168.3.103:9100) é comportamento
        # esperado do ZFS ARC (consome memória disponível pra cache por padrão, não é
        # pressão real) - ver known-issues/alertmanager_high_memory_alert_truenas.md.
        # Silenciado só pra essa instância via matcher duplo (alertname + instance),
        # não desabilitando a regra inteira (perderia o alerta real nos outros nodes).
        - receiver: "null"
          matchers:
            - alertname="NodeMemoryHighUtilization"
            - instance="192.168.3.103:9100"
          continue: false
    receivers:
      - name: notifications
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram-api-key/token
            chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram-chat-id/token
            parse_mode: "HTML"
            # Template Go (mesmo mecanismo de templating usado em todo o Alertmanager).
            # .CommonLabels/.CommonAnnotations cobrem o que é igual entre os alertas do
            # grupo; o range por .Alerts cobre o que varia por alerta individual (ex: instance).
            message: |-
              {{ if eq .Status "firing" }}🔥 <b>ALERTA</b>{{ else }}✅ <b>RESOLVIDO</b>{{ end }}: {{ .CommonLabels.alertname }}
              Severidade: <b>{{ .CommonLabels.severity }}</b>
              {{ range .Alerts }}
              • Instância: {{ .Labels.instance }}{{ if .Annotations.summary }}
                {{ .Annotations.summary }}{{ end }}
              {{ end }}
        # ntfy self-hosted (apps/ntfy/), alcançado via DNS interno do cluster - o Alertmanager
        # roda dentro do cluster, não precisa sair pela LAN/kube-vip/Pi-hole pra chegar nele.
        # Formato da mensagem: `?template=alertmanager` usa o template pré-definido embutido
        # do próprio ntfy (desde v2.10.0, imagem usada é v2.34.0) que entende nativamente o
        # JSON do webhook do Alertmanager e renderiza título/mensagem formatados - sem isso,
        # o webhook_configs manda o JSON cru como corpo, que o ntfy exibia como texto puro
        # (ilegível) e, com grupos de vários alertas, chegava a estourar o limite de tamanho
        # de mensagem e cair num fallback de anexo que falhava com "attachments not allowed"
        # (anexos não habilitados no deployment do ntfy) - origem do alerta
        # AlertmanagerFailedToSendAlerts (2026-11-07).
        webhook_configs:
          - url: http://ntfy.monitoring.svc.cluster.local/homelab-alerts?template=alertmanager
            send_resolved: true
      # O Helm substitui a lista "receivers" inteira (não faz merge item a item), mas
      # mantém a sub-rota padrão do chart que direciona o alerta sintético "Watchdog"
      # (dead man's switch, deve ficar silencioso) pro receiver "null" - sem redefinir
      # esse receiver aqui, a rota fica órfã e o Alertmanager rejeita a config inteira.
      - name: "null"

grafana:
  service:
    type: LoadBalancer
    # IP fixo alocado pelo kube-vip-cloud-provider (range 192.168.3.200-254)
    loadBalancerIP: 192.168.3.201
  # Loki (infrastructure/logging/loki-values.yaml), alcançado via DNS interno do cluster.
  # Service/porta confirmados via `kubectl get svc -n monitoring | grep loki`.
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
  # Dashboard do dcgm-exporter: NÃO usa o mecanismo `dashboards.<provider>.<nome>.gnetId`
  # do chart (tentado e descartado - essa versão do Grafana não processa o initContainer
  # de download via gnetId corretamente, dashboard nunca aparecia). Aplicado em vez disso
  # como ConfigMap manual (infrastructure/gpu-monitoring/dcgm-exporter-dashboard-configmap.yaml),
  # usando o mesmo label (grafana_dashboard: "1") que o sidecar já usa pros dashboards padrão.
  persistence:
    enabled: true
    storageClassName: truenas-nfs-ssd
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
