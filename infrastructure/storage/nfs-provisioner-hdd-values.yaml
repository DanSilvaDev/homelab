# nfs-subdir-external-provisioner (release: nfs-subdir-provisioner-hdd)
# Expõe o dataset data/k8s do TrueNAS (via bridge br1, IP estático 192.168.3.103)
# como StorageClass dinâmica para PVCs que não exigem I/O de SSD (dados maiores, menos sensíveis a latência).
#
# Hosts autorizados no export NFS (TrueNAS): 192.168.3.101 (control-plane),
# 192.168.3.102 (worker1), 192.168.3.105 (worker2). Quota do dataset: 100GiB.

nfs:
  server: 192.168.3.103
  path: /mnt/data/k8s

storageClass:
  name: truenas-nfs-hdd
  # local-path continua sendo o default do cluster; essa StorageClass é de uso explícito.
  defaultClass: false
  reclaimPolicy: Delete
  accessModes: ReadWriteOnce
