apiVersion: 1
groups:
    - orgId: 1
      name: Node is Down
      folder: Cluster
      interval: 5m
      rules:
        - uid: dg2iaa83x3m68f
          title: Node unresponsive
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: builder
                expr: up{job="node-exporter"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            description: Target {{ $labels.instance }} has been unreachable for more than 2 minutes.
            summary: Node {{ $labels.instance }} is down
          labels: {}
          isPaused: false
          notification_settings:
            receiver: Alert Manager
