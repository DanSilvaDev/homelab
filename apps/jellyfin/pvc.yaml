# Config PVC do Jellyfin (metadata, SQLite, thumbnails, etc) - separado do media-pvc,
# que é só a biblioteca de mídia. Ver clusters/media-stack/plan.md, tabela "Config PVCs".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-ssd
  resources:
    requests:
      storage: 5Gi
