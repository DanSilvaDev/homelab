apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-deployment
  namespace: media
spec:
  replicas: 1
  # Recreate, não RollingUpdate - config (SQLite) fica num PVC ReadWriteOnce, dois pods
  # escrevendo ao mesmo tempo durante um rollout corromperia o banco (mesmo padrão já
  # usado no Pi-hole).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Só roda no worker2 - único node com GPU (ver clusters/worker2/config.md).
      nodeSelector:
        gpu: "true"
      # 1000:1000 - mesma convenção dos demais apps da media stack (ver
      # clusters/media-stack/config.md, "PUID/PGID"). Antes rodava como root
      # (imagem oficial jellyfin/jellyfin não usa PUID/PGID, só respeita o UID
      # do container normalmente) - sobre NFS, requisições como root não
      # conseguiam ler arquivos com permissão restrita a dono/grupo (ex: .srt
      # gerados pelo Bazarr, modo 640, dono 1000:1000), mesmo com chown
      # funcionando normalmente como root (não é um root_squash "clássico" -
      # mecanismo exato não confirmado) - ver
      # troubleshooting/jellyfin_subtitle_permission_denied_nfs_root.md.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.4
          # Também .NET/ASP.NET Core - testando a hipótese de que o
          # known-issues/jellyfin_frequent_pod_restarts.md ("bug upstream de
          # WebSocket") seja na verdade o mesmo bloqueio do AppArmor padrão do
          # containerd sobre o auto-sinal (SIGRTMIN+3/SIGABRT) do GC, como
          # confirmado no Sonarr (ver
          # troubleshooting/sonarr_apparmor_gc_signal_crash.md).
          securityContext:
            appArmorProfile:
              type: Unconfined
          env:
            - name: TZ
              value: "America/Sao_Paulo"
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
              readOnly: true
          readinessProbe:
            # Não evita o crash em si (ver known-issues/jellyfin_frequent_pod_restarts.md -
            # bug upstream de WebSocket, não controlado por este repo), mas garante que o
            # Service pare de rotear tráfego pro pod durante os poucos segundos de restart,
            # em vez de deixar requisições caírem num pod morto/subindo.
            tcpSocket:
              port: 8096
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            # nvidia.com/gpu: "1" - um dos 2 slots liberados pelo time-slicing (ver
            # infrastructure/nvidia-device-plugin/values.yaml); o outro fica com o
            # dcgm-exporter. NVENC/NVDEC fica disponível automaticamente via o runtime
            # nvidia do containerd (já configurado como default no worker2) - sem
            # precisar de runtimeClassName nem mount manual de /dev, mesmo padrão já
            # validado no pod de teste CUDA (ver worker2/config.md, "Validação final").
            limits:
              nvidia.com/gpu: "1"
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-pvc
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
