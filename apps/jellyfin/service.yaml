apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  type: LoadBalancer
  # IP fixo alocado pelo kube-vip-cloud-provider (range 192.168.3.200-254). .202 ficou
  # livre após a remoção do Rancher (ver clusters/observability/config.md) - confirmado
  # livre em 2026-11-02 via `kubectl get svc -A -o wide | grep loadbalancer`.
  loadBalancerIP: 192.168.3.202
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 80
      targetPort: 8096
