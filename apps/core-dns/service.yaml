apiVersion: v1
kind: Service
metadata:
  name: dns-service-lb
  namespace: dns-services
  annotations:
    # Único Service pedindo este IP ao Kube-VIP (ver histórico do bug de IP
    # duplicado em troubleshooting/pihole_dns_wrong_loadbalancer_ip.md - isso
    # continua valendo, não crie outro Service pedindo este mesmo IP).
    kube-vip.io/loadbalancerIP: "192.168.3.200"
spec:
  type: LoadBalancer
  ports:
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: dns-tcp
    port: 53
    protocol: TCP
    targetPort: 53
  selector:
    # Só o coredns-bypass - ele é o único listener real de DNS agora (ver
    # core-dns/config-map.yaml). O Pi-hole deixou de ser um backend direto
    # deste Service: antes os dois pods compartilhavam a label `server:
    # dns-provider` e o kube-proxy fazia round-robin cego entre eles sempre
    # que ambos estavam Ready (o que é o estado normal, não só durante
    # failover) - isso fazia consultas .home falharem intermitentemente
    # mesmo com tudo saudável. Agora o CoreDNS encaminha pro Pi-hole via
    # Service interno (apps/pihole/dns-service.yaml) com failover de
    # verdade (health-check do plugin forward), não via Service/Endpoints
    # compartilhado. A UI do Pi-hole (porta 80) tem seu próprio Service -
    # ver apps/pihole/service.yaml.
    app: coredns-bypass
