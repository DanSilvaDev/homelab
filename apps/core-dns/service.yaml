apiVersion: v1
kind: Service
metadata:
  name: dns-service-lb
  namespace: default
  annotations:
    # Mesmo endereço do pi-hole
    kube-vip.io/loadbalancerIP: "192.168.3.200" 
spec:
  type: LoadBalancer
  ports:
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: dns-tcp
    port: 53
    protocol: TCP
    targetPort: 53
  selector:
    # IMPORTANTE: Esta label deve existir tanto no Pod do Pi-hole
    # quanto no Pod do coredns-bypass para o Kube-VIP unificar o tráfego
    server: dns-provider
