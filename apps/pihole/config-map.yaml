apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-configs
data:
  TZ: 'America/Sao_Paulo'
  FTLCONF_dns_listeningMode: 'ALL'
  #FTLCONF_dns_upstreams: '1.1.1.1;8.8.8.8;10.43.0.10#53'
  FTLCONF_webserver_api_password: '' #no password
  FTLCONF_dns_rateLimit_count: '0'
  FTLCONF_dns_rateLimit_interval: '0'
  FTLCONF_ntp_sync_server: 'pool.ntp.br'
  FTLCONF_database_maxDBdays: '7'
  #FTLCONF_dns_hosts: '192.168.3.200'
  #FTLCONF_dns_reply_host_IPv4: '192.168.3.200'
  FTLCONF_dhcp_active: "false"
  FTLCONF_dhcp_router: '192.168.3.1'
  #FTLCONF_dns_reply_host_IPv4: '192.168.3.200'
  FTLCONF_dns_port: '93' 