apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole-app
  template:
    metadata:
      labels:
        app: pihole-app
    spec:
      volumes:
        - name: pihole-pv
          persistentVolumeClaim:
            claimName: pihole-pvc
      containers:
        - name: pihole
          image: pihole/pihole:2026.10.0
          envFrom:
            - configMapRef:
                name: pihole-configs
            #- secretRef:
            #   name: pihole-secrets
          securityContext:
            capabilities:
              add: ["SYS_NICE"]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: dns-udp
              containerPort: 93
              protocol: UDP
            - name: dns-tcp
              containerPort: 93
              protocol: TCP
          volumeMounts:
            - name: pihole-pv
              mountPath: "/etc/pihole"
          resources:
            limits:
              memory: 2G
              cpu: 1
            requests:
              memory: 1G
              cpu: 100m  
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.1.1.2
      #hostNetwork: true
      #dnsPolicy: ClusterFirstWithHostNet