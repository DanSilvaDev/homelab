apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-deployment
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole-app
  template:
    metadata:
      labels:
        app: pihole-app
    spec:
      volumes:
        - name: pihole-pv
          persistentVolumeClaim:
            claimName: pihole-pvc
      containers:
        - name: pihole
          image: pihole/pihole:2026.10.0
          envFrom:
            - configMapRef:
                name: pihole-configs
          securityContext:
            capabilities:
              add: ["SYS_NICE"]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: dns-udp
              containerPort: 93
              protocol: UDP
            - name: dns-tcp
              containerPort: 93
              protocol: TCP
          volumeMounts:
            - name: pihole-pv
              mountPath: "/etc/pihole"
          resources:
            # Uso real medido via `kubectl top pod`: 9-16m CPU / 81-136Mi memoria.
            # Limits com margem para picos (atualizacao do gravity.db, rajadas de consulta).
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 128Mi
              cpu: 50m
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.1.1.2