apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-deploynent
spec:
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      volumes:
        - name: pihole-pv
          persistentVolumeClaim:
            claimName: pihole-pvc
      containers:
        - name: pihole
          image: pihole/pihole:2025.11.1
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP   
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: pihole-pv
              mountPath: "/etc/pihole"
          resources:
            limits:
              memory: "512Mi"
              cpu: "1000m"
