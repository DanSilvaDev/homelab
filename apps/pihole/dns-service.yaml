apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  namespace: dns-services
  # ClusterIP (sem LoadBalancer) - só o coredns-bypass fala com este Service,
  # via DNS interno do cluster (ver forward em apps/core-dns/config-map.yaml).
  # Antes o Pi-hole era selecionado junto com o coredns-bypass num Service
  # compartilhado (dns-service-lb) via uma label em comum - isso fazia o
  # kube-proxy alternar round-robin entre os dois sempre que ambos estavam
  # Ready (o que é o estado normal, não só durante failover), derrubando
  # consultas .home intermitentemente mesmo com tudo saudável. Separar num
  # Service só do Pi-hole dá ao coredns-bypass um alvo estável pra fazer o
  # health-check e a preferência de verdade (policy sequential).
spec:
  type: ClusterIP
  # Fixo de propósito (era auto-atribuído: 10.43.180.116) - o plugin forward
  # do CoreDNS (ver apps/core-dns/config-map.yaml) só aceita IP literal como
  # upstream, não hostname/FQDN do Service (erro: "not an IP address or
  # file"). Sem fixar aqui, recriar este Service poderia sortear outro IP e
  # quebrar o forward silenciosamente. Mesma técnica usada pelo Service do
  # CoreDNS interno do próprio cluster (kube-dns), que também precisa de um
  # IP estável conhecido antecipadamente.
  clusterIP: 10.43.180.116
  selector:
    app: pihole-app
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
