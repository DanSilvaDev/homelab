apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: pihole-gateway-class
spec:
  controllerName: pihole.local/gateway-controller


---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pihole-gateway
spec:
  gatewayClassName: pihole-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "www.pihole.local"
    allowedRoutes:
      namespaces:
        from: All

---
#http route
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole-http-route
spec:
  parentRefs:
    - name: pihole-gateway
  hostnames:
    - "www.pihole.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: pihole-service
          port: 80

