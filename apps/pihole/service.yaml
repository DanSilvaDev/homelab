apiVersion: v1
kind: Service
metadata:
  name: pihole-svc
  labels:
    app: pihole-app
  annotations:
    # ESTA LINHA DIZ AO KUBE-VIP PARA ARRANCAR UM IP DO POOL GLOBAL
    kube-vip.io/ipam: "true"
spec:
  selector:
    app: pihole-app
  type: LoadBalancer
  ports:
  - protocol: TCP
    name: http
    port: 80
    targetPort: 80
  - protocol: TCP
    name: dns-tcp
    port: 53
    targetPort: 93
  - protocol: UDP
    name: dns-udp
    port: 53
    targetPort: 93
