apiVersion: v1
kind: Service
metadata:
  name: pihole-svc
  namespace: pihole
  labels:
    app: pihole-app
spec:
  selector:
    app: pihole-app
  type: LoadBalancer
  ports:
  - protocol: TCP
    name: http
    port: 80
    targetPort: 80
  - protocol: TCP
    name: dnc-tcp
    port: 53
    targetPort: 93
  - protocol: UDP
    name: dnc-udp
    port: 53
    targetPort: 93