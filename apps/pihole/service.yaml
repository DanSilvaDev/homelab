apiVersion: v1
kind: Service
metadata:
  name: pihole-svc
  labels:
    app: pihole-app
  annotations:
    # IP fixo (nao mais via IPAM) para poder ser compartilhado com o dns-service-lb
    # (ver apps/core-dns/service.yaml) sem depender da ordem de alocacao do pool.
    kube-vip.io/loadbalancerIP: "192.168.3.200"
spec:
  selector:
    app: pihole-app
  type: LoadBalancer
  ports:
  - protocol: TCP
    name: http
    port: 80
    targetPort: 80
