apiVersion: v1
kind: Service
metadata:
  name: pihole-service
spec:
  selector:
    app: pihole
  type: NodePort
  externalIPs:
    - 192.168.3.102
  ports:
  - protocol: TCP
    name: http
    port: 80
    targetPort: 80
    nodePort: 30080
  - protocol: TCP
    name: https
    port: 443
    targetPort: 443
    nodePort: 30443
  - protocol: TCP
    name: dns-tcp
    port: 53
    targetPort: 53
    #nodePort: 30053
  - protocol: UDP
    name: dns-udp
    port: 53
    targetPort: 53
    #nodePort: 30053