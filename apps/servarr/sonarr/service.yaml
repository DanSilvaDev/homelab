apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
spec:
  type: LoadBalancer
  # IP fixo alocado pelo kube-vip-cloud-provider (range 192.168.3.200-254).
  # .208 confirmado livre em 2026-11-02 via
  # `kubectl get svc -A -o wide | grep -i loadbalancer` antes de fixar.
  loadBalancerIP: 192.168.3.208
  selector:
    app: sonarr
  ports:
    - name: http
      port: 80
      targetPort: 8989
