apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr-deployment
  namespace: media
spec:
  replicas: 1
  # Recreate, não RollingUpdate - config (SQLite) em PVC ReadWriteOnce, dois
  # pods escrevendo ao mesmo tempo corromperia o banco.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          # O perfil padrão de AppArmor do containerd bloqueia o auto-sinal
          # (SIGRTMIN+3/SIGABRT) que o GC do .NET usa pra suspender threads,
          # matando o processo sem deixar rastro no log (ver
          # troubleshooting/sonarr_apparmor_gc_signal_crash.md).
          securityContext:
            appArmorProfile:
              type: Unconfined
          env:
            # PUID/PGID 1000:1000 - mesma convenção da Fase 4 (ver
            # clusters/media-stack/config.md). Precisa bater com o dono das
            # pastas em data/midias pro Sonarr conseguir mover/criar
            # hardlinks de downloads/ pra tv/.
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Sao_Paulo"
          ports:
            - name: http
              containerPort: 8989
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
