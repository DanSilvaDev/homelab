apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
spec:
  type: LoadBalancer
  # IP fixo alocado pelo kube-vip-cloud-provider (range 192.168.3.200-254).
  # .207 confirmado livre em 2026-11-02 via
  # `kubectl get svc -A -o wide | grep -i loadbalancer` antes de fixar.
  loadBalancerIP: 192.168.3.207
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 80
      targetPort: 9696
