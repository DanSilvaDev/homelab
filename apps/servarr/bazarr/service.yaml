apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: media
spec:
  type: LoadBalancer
  # IP fixo alocado pelo kube-vip-cloud-provider (range 192.168.3.200-254).
  # .212 confirmado livre em 2026-11-02 via
  # `kubectl get svc -A -o wide | grep -i loadbalancer` antes de fixar.
  loadBalancerIP: 192.168.3.212
  selector:
    app: bazarr
  ports:
    - name: http
      port: 80
      targetPort: 6767
