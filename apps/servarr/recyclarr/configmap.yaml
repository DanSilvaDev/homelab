# Config do Recyclarr (CLI, não daemon - roda via CronJob, ver cronjob.yaml).
# API keys NÃO ficam aqui: usam substituição `!env_var NOME_DA_VAR` (suportado desde
# a v4.3.0 do Recyclarr), lidas de env vars alimentadas pelo Secret `recyclarr-api-keys`
# (criado manualmente via `kubectl create secret`, nunca commitado - mesmo padrão do
# Gluetun/Surfshark e do Unpackerr).
#
# Recyclarr só tem suporte oficial a Sonarr e Radarr (não Lidarr) - mesma classe de
# limitação já documentada pro Unpackerr/LazyLibrarian.
#
# Perfis de qualidade (quality_profiles) copiados dos templates oficiais do próprio
# Recyclarr (github.com/recyclarr/config-templates, branch v8) - WEB-1080p pro Sonarr
# (sonarr/templates/web-1080p.yml) e HD Bluray + WEB pro Radarr (template equivalente
# citado na documentação oficial). trash_ids reais, não inventados - mas são só um
# ponto de partida de qualidade "boa o suficiente para a maioria"; revisar/trocar se
# quiser outro perfil (ex: remux, 2160p, anime) via o mesmo repo de templates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: media
data:
  recyclarr.yml: |
    radarr:
      main:
        base_url: http://radarr:80
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true
        quality_definition:
          type: movie
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true

    sonarr:
      main:
        base_url: http://sonarr:80
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true
        quality_definition:
          type: series
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
            - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
