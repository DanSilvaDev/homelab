apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr-deployment
  namespace: media
spec:
  replicas: 1
  # Recreate, não RollingUpdate - config (SQLite) em PVC ReadWriteOnce, dois
  # pods escrevendo ao mesmo tempo corromperia o banco.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          # Mesma família de código do Sonarr (.NET/CoreCLR) - vulnerável ao
          # mesmo bloqueio do AppArmor padrão do containerd sobre o auto-sinal
          # (SIGRTMIN+3/SIGABRT) usado pelo GC pra suspender threads, que mata
          # o processo sem deixar rastro no log (ver
          # troubleshooting/sonarr_apparmor_gc_signal_crash.md).
          securityContext:
            appArmorProfile:
              type: Unconfined
          env:
            # PUID/PGID 1000:1000 - mesma convenção da Fase 4 (ver
            # clusters/media-stack/config.md). Precisa bater com o dono das
            # pastas em data/midias pro Radarr conseguir mover/criar
            # hardlinks de downloads/ pra movies/.
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Sao_Paulo"
          ports:
            - name: http
              containerPort: 7878
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
